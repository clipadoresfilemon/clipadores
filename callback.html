<!doctype html><html><head><meta charset="utf-8"><title>Conectando…</title></head><body style="font-family:-apple-system,sans-serif;text-align:center;margin-top:80px">
<h2>Conectando ao Mac…</h2>
<script>
// Endereço de retorno do login (Meta/TikTok exigem https). Repassa o código para o script que está esperando no próprio Mac.
var q = new URLSearchParams(location.search), porta = (q.get("state") || "").split(".")[0];
if (/^\d{4,5}$/.test(porta)) location.replace("http://127.0.0.1:" + porta + "/" + location.search);
else document.body.innerHTML = "<h2>Endereço inválido. Rode o 'Conectar conta' de novo.</h2>";
</script></body></html>
